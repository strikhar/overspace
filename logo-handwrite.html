<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overspace — Product Design Studio (handwrite test)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
<style>
  body{
    font-family:Arial, Helvetica, sans-serif;
    max-width:640px;
    margin:40px auto;
    padding:0 16px 60px;
    background:#ffffff;
    color:#111111;
    font-size:15px;
    line-height:21px;
  }
  h1{
    margin:0.2em 0 0.4em;
    line-height:0;
  }
  .sr-only{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }
  #logo-svg{
    display:block;
    width:100%;
    max-width:420px;
    height:96px;
    overflow:visible;
  }
  #logo-svg path{
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .tag{
    display:inline-block;
    font-size:12px;
    color:#888;
    margin-bottom:32px;
  }
</style>
</head>
<body>

<h1>
  <svg id="logo-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  <span class="sr-only">Overspace</span>
</h1>
<p class="tag">variant: real pen-path tracing (opentype.js + SVG stroke-dashoffset) &mdash; compare against <a href="/index.html">index.html</a></p>

<script>
(function(){
  var svg = document.getElementById('logo-svg');
  var text = 'Overspace';
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var fontUrls = [
    'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/shadowsintolight/ShadowsIntoLight.ttf',
    'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/patrickhand/PatrickHand-Regular.ttf',
    'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/gochihand/GochiHand-Regular.ttf',
    'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/kalam/Kalam-Bold.ttf',
    'https://cdn.jsdelivr.net/gh/google/fonts@main/apache/permanentmarker/PermanentMarker-Regular.ttf'
  ];
  var crayons = ['#e0433c','#1d6fe0','#2a9d47','#f2a30f','#8e44ad','#e0559f','#16a085','#c0392b','#2980b9'];

  var fontCache = {};
  function loadFont(url){
    if (fontCache[url]) return fontCache[url];
    fontCache[url] = new Promise(function(resolve, reject){
      opentype.load(url, function(err, font){
        if (err) reject(err); else resolve(font);
      });
    });
    return fontCache[url];
  }

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
  function wait(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }

  function makePath(strokeColor){
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('stroke', strokeColor);
    svg.appendChild(p);
    return p;
  }

  async function drawTracedLogo(){
    var url = pick(fontUrls);
    var colorA = pick(crayons);
    var colorB = pick(crayons);
    if (colorB === colorA) colorB = pick(crayons);

    var font;
    try {
      font = await loadFont(url);
    } catch (e) {
      return; // font failed to load (offline, CDN hiccup) — just skip this cycle
    }

    var fontSize = 90;
    var advance = font.getAdvanceWidth(text, fontSize);
    var ascender = font.ascender / font.unitsPerEm * fontSize;
    var descender = font.descender / font.unitsPerEm * fontSize;
    var padding = fontSize * 0.08;

    var viewW = advance + padding * 2;
    var viewH = ascender - descender + padding * 2;
    svg.setAttribute('viewBox', (-padding) + ' ' + (-ascender - padding) + ' ' + viewW + ' ' + viewH);

    svg.innerHTML = '';
    var strokeWidth = fontSize * 0.045;

    // Build one <path> per letter (not one path for the whole word) —
    // stroke-dasharray resets at every subpath/moveto, so a single dash
    // value sized for the *whole word* never animates individual letters
    // correctly. Per-letter paths let each one get a dash length that
    // actually matches its own path, so it traces properly.
    var x = 0;
    var letters = [];
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      var glyphPath = font.getPath(ch, x, 0, fontSize);
      var d = glyphPath.toPathData(2);
      x += font.getAdvanceWidth(ch, fontSize);
      if (!d) continue; // e.g. space
      letters.push({ d: d });
    }

    var speed = 1100; // path units traced per second — very quick hand pace

    var built = letters.map(function(letter, idx){
      var color = idx % 2 === 0 ? colorA : colorB;
      var p = makePath(color);
      p.setAttribute('d', letter.d);
      p.setAttribute('stroke-width', strokeWidth);
      p.setAttribute('opacity', '0.85');
      var len = p.getTotalLength();
      var duration = Math.min(260, Math.max(50, (len / speed) * 1000));
      if (reduceMotion) {
        return { el: p, len: len, duration: 0 };
      }
      p.style.strokeDasharray = len + ' ' + len;
      p.style.strokeDashoffset = String(len);
      return { el: p, len: len, duration: duration };
    });

    if (reduceMotion) return;

    // force the initial (fully-hidden) dash state to commit before animating
    svg.getBoundingClientRect();

    var t = 0;
    built.forEach(function(item){
      item.el.style.transition = 'stroke-dashoffset ' + item.duration + 'ms linear ' + t + 'ms';
      t += item.duration * 0.35; // overlap between letters, like a hand not fully stopping
    });
    requestAnimationFrame(function(){
      built.forEach(function(item){ item.el.style.strokeDashoffset = '0'; });
    });

    await wait(t + (built.length ? built[built.length - 1].duration : 0) + 100);
  }

  async function loop(){
    await drawTracedLogo();
    await wait(700);
    loop();
  }

  if (!location.search.includes('nodemo')) { loop(); }
  window.__drawTracedLogo = drawTracedLogo;
})();
</script>

</body>
</html>
